# FireSteal config — FireCraft SMP
hearts:
  start: 10          # hearts a new player begins with
  min: 0             # at or below this => eliminated
  max: 20            # hard cap (clamped; protects client from insane maxHealth)
  loss-on-pvp: 1     # hearts the victim loses when killed by a player
  gain-on-kill: 1    # hearts the killer gains (up to max)
  loss-on-natural: 0 # hearts lost on non-PvP death

elimination:
  mode: SPECTATOR    # SPECTATOR | BAN | KICK
  ban-message: "§cYou have been eliminated on FireCraft SMP."

anti-farm:
  same-victim-cooldown-seconds: 600  # same victim->killer won't give hearts again within this window (0 = off)
  block-same-ip: true                # alt-on-same-IP kills give no hearts

withdraw:
  enabled: true
  item-name: "§cHeart"
  item-lore: "§7Right-click to gain a heart."

storage:
  # SQLite file lives in the plugin data folder.
  file: firesteal.db

messages:
  prefix: "§6[FireSteal] §r"
